<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <title>Termo Game | 7 Days Of Code - Alura</title>
</head>
<body>
    <header>
        <img src="./images/Logo.png"> 

        <h2>Tente adivinhar a palavra sorteada</h2>
    </header>

    <main>
        <section class="tabuleiro">

            <div class="linha">

                <div class="quadrado"></div>
                <div class="quadrado"></div>
                <div class="quadrado"></div>
                <div class="quadrado"></div>
                <div class="quadrado"></div>

            </div>

            <div class="linha">

                <div class="quadrado"></div>
                <div class="quadrado"></div>
                <div class="quadrado"></div>
                <div class="quadrado"></div>
                <div class="quadrado"></div>

            </div>

            <div class="linha">

                <div class="quadrado"></div>
                <div class="quadrado"></div>
                <div class="quadrado"></div>
                <div class="quadrado"></div>
                <div class="quadrado"></div>

            </div>

            <div class="linha">

                <div class="quadrado"></div>
                <div class="quadrado"></div>
                <div class="quadrado"></div>
                <div class="quadrado"></div>
                <div class="quadrado"></div>

            </div>

            <div class="linha">

                <div class="quadrado"></div>
                <div class="quadrado"></div>
                <div class="quadrado"></div>
                <div class="quadrado"></div>
                <div class="quadrado"></div>

            </div>

            <div class="linha">

                <div class="quadrado"></div>
                <div class="quadrado"></div>
                <div class="quadrado"></div>
                <div class="quadrado"></div>
                <div class="quadrado"></div>

            </div>

        </section>

        <section class="teclado">

            <div class="linha-teclado">

                <button class="quadrado-teclado" value="Q">Q</button>
                <button class="quadrado-teclado" value="W">W</button>
                <button class="quadrado-teclado" value="E">E</button>
                <button class="quadrado-teclado" value="R">R</button>
                <button class="quadrado-teclado" value="T">T</button>
                <button class="quadrado-teclado" value="Y">Y</button>
                <button class="quadrado-teclado" value="U">U</button>
                <button class="quadrado-teclado" value="I">I</button>
                <button class="quadrado-teclado" value="O">O</button>
                <button class="quadrado-teclado" value="P">P</button>

            </div>

            <div class="linha-teclado">

                <button class="quadrado-teclado" value="A">A</button>
                <button class="quadrado-teclado" value="S">S</button>
                <button class="quadrado-teclado" value="D">D</button>
                <button class="quadrado-teclado" value="F">F</button>
                <button class="quadrado-teclado" value="G">G</button>
                <button class="quadrado-teclado" value="H">H</button>
                <button class="quadrado-teclado" value="J">J</button>
                <button class="quadrado-teclado" value="K">K</button>
                <button class="quadrado-teclado" value="L">L</button>

            </div>

            <div class="linha-teclado">

                <button class="quadrado-teclado-enter" value="enter">ENTER</button>
                <button class="quadrado-teclado" value="Z">Z</button>
                <button class="quadrado-teclado" value="X">X</button>
                <button class="quadrado-teclado" value="C">C</button>
                <button class="quadrado-teclado" value="V">V</button>
                <button class="quadrado-teclado" value="B">B</button>
                <button class="quadrado-teclado" value="N">N</button>
                <button class="quadrado-teclado" value="M">M</button>
                <button class="quadrado-teclado-apagar" value="backspace">
                    <img src="./images/Vector.png" alt="butão para apagar">
                </button>

            </div>
        </section>

        <div class="areaButãoReset">
            <button class="bntReset">JOGAR NOVAMENTE</button>
        </div>
    </main>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="./script.js"></script>
</body>
</html>
