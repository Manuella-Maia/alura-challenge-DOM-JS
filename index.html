<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <title>Termo Game | 7 Days Of Code - Alura</title>
</head>
<body>
    <header>
        <img src="./images/Logo.png"> 

        <h2>Tente adivinhar a palavra sorteada</h2>
    </header>

    <main>
        <section class="tabuleiro">

            <div class="linha">

                <div class="quadrado"></div>
                <div class="quadrado"></div>
                <div class="quadrado"></div>
                <div class="quadrado"></div>
                <div class="quadrado"></div>

            </div>

            <div class="linha">

                <div class="quadrado"></div>
                <div class="quadrado"></div>
                <div class="quadrado"></div>
                <div class="quadrado"></div>
                <div class="quadrado"></div>

            </div>

            <div class="linha">

                <div class="quadrado"></div>
                <div class="quadrado"></div>
                <div class="quadrado"></div>
                <div class="quadrado"></div>
                <div class="quadrado"></div>

            </div>

            <div class="linha">

                <div class="quadrado"></div>
                <div class="quadrado"></div>
                <div class="quadrado"></div>
                <div class="quadrado"></div>
                <div class="quadrado"></div>

            </div>

            <div class="linha">

                <div class="quadrado"></div>
                <div class="quadrado"></div>
                <div class="quadrado"></div>
                <div class="quadrado"></div>
                <div class="quadrado"></div>

            </div>

            <div class="linha">

                <div class="quadrado"></div>
                <div class="quadrado"></div>
                <div class="quadrado"></div>
                <div class="quadrado"></div>
                <div class="quadrado"></div>

            </div>

        </section>

        <section class="teclado">

            <div class="linha-teclado">

                <button class="quadrado-teclado" id="quadrado-teclado-Q">Q</button>
                <button class="quadrado-teclado" id="quadrado-teclado-W">W</button>
                <button class="quadrado-teclado" id="quadrado-teclado-E">E</button>
                <button class="quadrado-teclado" id="quadrado-teclado-R">R</button>
                <button class="quadrado-teclado" id="quadrado-teclado-T">T</button>
                <button class="quadrado-teclado" id="quadrado-teclado-Y">Y</button>
                <button class="quadrado-teclado" id="quadrado-teclado-U">U</button>
                <button class="quadrado-teclado" id="quadrado-teclado-I">I</button>
                <button class="quadrado-teclado" id="quadrado-teclado-O">O</button>
                <button class="quadrado-teclado" id="quadrado-teclado-Q">P</button>

            </div>

            <div class="linha-teclado">

                <button class="quadrado-teclado" id="quadrado-teclado-A">A</button>
                <button class="quadrado-teclado" id="quadrado-teclado-S">S</button>
                <button class="quadrado-teclado" id="quadrado-teclado-D">D</button>
                <button class="quadrado-teclado" id="quadrado-teclado-F">F</button>
                <button class="quadrado-teclado" id="quadrado-teclado-G">G</button>
                <button class="quadrado-teclado" id="quadrado-teclado-H">H</button>
                <button class="quadrado-teclado" id="quadrado-teclado-J">J</button>
                <button class="quadrado-teclado" id="quadrado-teclado-K">K</button>
                <button class="quadrado-teclado" id="quadrado-teclado-L">L</button>

            </div>

            <div class="linha-teclado">

                <button class="quadrado-teclado-enter" id="quadrado-teclado-ENTER">ENTER</button>
                <button class="quadrado-teclado" id="quadrado-teclado-Z">Z</button>
                <button class="quadrado-teclado" id="quadrado-teclado-X">X</button>
                <button class="quadrado-teclado" id="quadrado-teclado-C">C</button>
                <button class="quadrado-teclado" id="quadrado-teclado-V">V</button>
                <button class="quadrado-teclado" id="quadrado-teclado-B">B</button>
                <button class="quadrado-teclado" id="quadrado-teclado-N">N</button>
                <button class="quadrado-teclado" id="quadrado-teclado-M">M</button>
                <button class="quadrado-teclado-apagar" id="quadrado-teclado-APAGAR">
                    <img src="./images/Vector.png" alt="butão para apagar">
                </button>

            </div>
        </section>
    </main>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="./script.js"></script>
</body>
</html>
